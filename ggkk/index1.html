<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   .image-container {
  display: flex;
  overflow: hidden;
}

.image-link {
  position: relative;
  margin-right: 10px;
}

.image-text {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: rgba(0, 0, 0, 0.5);
  color: #fff;
  padding: 5px;
  font-size: 16px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.2s ease-in-out;
}

.image-link:hover .image-text {
  opacity: 1;
}
img{
    display: flex;
    width: 300px;
}
.image-link img {
  transition: transform 0.2s ease-in-out;
  max-width: 100%;
  max-height: 100%;
}

.image-link:hover img {
  transform: scale(1.05);
}

</style>
<body>
    <h1 style="text-align: center;">EXPLORE US</h1> <br>
    <div class="image-container">
        <a href="#" class="image-link">
          <img src="https://rameshys.s3.eu-north-1.amazonaws.com/img/e1.jpeg" alt="Image 1">
          <div class="image-text">SCHOOLING</div>
        </a>
        <a href="#" class="image-link">
          <img src="https://rameshys.s3.eu-north-1.amazonaws.com/img/e21.jpg" alt="Image 2">
          <div class="image-text">INTERMEDIATE</div>
        </a>
        <a href="#" class="image-link">
          <img src="https://rameshys.s3.eu-north-1.amazonaws.com/img/e31.jpg" alt="Image 3">
          <div class="image-text">ENGINEERING</div>
        </a>
        <a href="#" class="image-link">
          <img src="https://rameshys.s3.eu-north-1.amazonaws.com/img/e41.jpg" alt="Image 4">
          <div class="image-text">MUSIC AND DANCE</div>
        </a>
      </div>
      
</body>
</html>
