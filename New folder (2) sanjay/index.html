<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.0.1/lib/anime.min.js"></script>
    <script src="https://kit.fontawesome.com/eb3c934bad.js" crossorigin="anonymous"></script>
    <style>
     body{
                    /* display: flex; */
                    
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                    /* background: url('https://clueylearning.com.au/wp-content/uploads/2019/10/What-is-tutoring-Different-types-of-tutoring-explained.jpg') no-repeat; */
                    background-size: cover;
                    background-position: center;
                 }
               *{
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                  font-family: 'poppins',sans-serif;
               }
                 
                 header{
                  position: relative;
                  top: 0;
                  left: 0;
                  width: 100%;
                  
                 padding: 20px 100px;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  z-index: 99;
               
                 }
                 .logo{
                  font-size: 2em;
                  color: #fff;
                  user-select: none;
                 }
                 .navigation a{
                  position: relative;
                  font-size: 1.1em;
                  color: #ff0000;
                  text-decoration: none;
                  font-weight: 500;
                  margin-left: 40px;
                 }
                 .navigation .btnLogin-popup{
                  width: 130px;
                  height: 50px;
                  background: transparent;
                  border: 2px solid #000000;
                  outline: none;
                  border-radius: 6px;
                  cursor: pointer;
                  font-size: 1.1em;
                  color: rgb(0, 0, 0);
                  font-weight: 500;
                  margin-left: 40px;
                  transition: .5s;
                 }
                 .navigation .btnLogin-popup:hover{
                  background: #b0f8f2;
                  color: #162938;
                  
                 }
    </style>
</head>
<body>
    header>
    <h2 class="logo" style="color: transparent;">.</h2>
    <nav class="navigation">
       <!-- <a href="#">home</a>
       <a href="#">about</a>
       <a href="#">service</a>
       <a href="#">contact</a> -->
    <button class="btnLogin-popup">LOGIN</button>
 </nav>
 </header> 
</body>
